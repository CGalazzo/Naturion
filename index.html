<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#071018">
  <title>Naturion — Guardiões da Natureza</title>
  <style>
    :root{color-scheme:dark;--gold:#d8b94f;--panel:#0a1d14}
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#071018;font-family:Arial,Helvetica,sans-serif;color:#fff}
    body{display:grid;place-items:center}
    .game{position:relative;width:min(100vw,calc(100vh*25/16));height:min(100vh,calc(100vw*16/25));aspect-ratio:25/16;overflow:hidden;background:#071018;box-shadow:0 20px 70px #0008}
    .art{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:cover;user-select:none;-webkit-user-drag:none}
    .hit{position:absolute;border:0;border-radius:18px;background:transparent;cursor:pointer;color:transparent;font-size:0;outline:0;transition:.15s}
    .hit:hover,.hit:focus-visible{box-shadow:inset 0 0 0 5px #ffffffb3,0 0 26px #ffe664bf}
    .hit:active{transform:translateY(3px)}
    #newJourney{left:34.8%;top:53.8%;width:31.6%;height:11.5%}
    #optionsButton{left:35.5%;top:67.2%;width:30.5%;height:11.3%}
    .load-error{position:absolute;inset:0;display:grid;place-items:center;padding:32px;text-align:center;background:linear-gradient(145deg,#102b20,#071018);font-weight:800;line-height:1.5}
    .load-error[hidden]{display:none}
    .modal[hidden]{display:none}
    .modal{position:fixed;inset:0;display:grid;place-items:center;padding:20px;background:#000a;backdrop-filter:blur(5px);z-index:20}
    .card{width:min(92vw,540px);padding:26px;border:2px solid var(--gold);border-radius:22px;background:linear-gradient(#183d28,#081a11);box-shadow:0 20px 60px #0009}
    .card h2{margin:0 0 20px;text-align:center;color:#f2d77d}
    .setting{display:grid;gap:8px;margin:17px 0;padding:13px;background:#ffffff0f;border-radius:14px}
    .setting input[type=range]{width:100%;accent-color:#62a744}
    .toggle{display:flex;justify-content:space-between;align-items:center}.toggle input{width:23px;height:23px;accent-color:#62a744}
    .close{display:block;margin:22px auto 0;min-width:180px;padding:13px 28px;border:0;border-radius:13px;background:linear-gradient(#7dc84d,#34712d);color:#fff;font-weight:900;font-size:1rem;cursor:pointer}
    .toast{position:fixed;left:50%;bottom:25px;transform:translateX(-50%) translateY(20px);max-width:min(90vw,620px);padding:13px 18px;border:1px solid var(--gold);border-radius:13px;background:#081810f5;font-weight:800;text-align:center;opacity:0;pointer-events:none;transition:.2s;z-index:30}
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  </style>
</head>
<body>
  <main class="game" aria-label="Tela inicial do Naturion">
    <img id="startArt" class="art" alt="Naturion — Guardiões da Natureza">
    <div id="loadError" class="load-error" hidden>Não foi possível carregar a arte da tela inicial.<br>Atualize a página para tentar novamente.</div>
    <button class="hit" id="newJourney" type="button" aria-label="Nova Jornada">Nova Jornada</button>
    <button class="hit" id="optionsButton" type="button" aria-label="Opções">Opções</button>
  </main>

  <section class="modal" id="optionsModal" hidden aria-hidden="true">
    <div class="card" role="dialog" aria-modal="true" aria-labelledby="optionsTitle">
      <h2 id="optionsTitle">Opções</h2>
      <div class="setting"><label for="musicVolume">Volume da música</label><input id="musicVolume" type="range" min="0" max="100" value="70"></div>
      <div class="setting"><label for="effectsVolume">Volume dos efeitos</label><input id="effectsVolume" type="range" min="0" max="100" value="85"></div>
      <div class="setting toggle"><label for="fullscreen">Tela cheia</label><input id="fullscreen" type="checkbox"></div>
      <button class="close" id="closeOptions" type="button">Fechar</button>
    </div>
  </section>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>window.NATURION_BG='';</script>
  <script src="./assets/naturion-bg-01.js"></script>
  <script src="./assets/naturion-bg-02.js"></script>
  <script src="./assets/naturion-bg-03-04.js"></script>
  <script src="./assets/naturion-bg-05-06.js"></script>
  <script src="./assets/naturion-bg-07-08.js"></script>
  <script src="./assets/naturion-bg-09-10.js"></script>
  <script src="./assets/naturion-bg-11-12.js"></script>
  <script src="./assets/naturion-bg-13-14.js"></script>
  <script>
    const EXPECTED_BG_LENGTH=67172;
    const art=document.getElementById('startArt');
    const loadError=document.getElementById('loadError');
    if(typeof window.NATURION_BG==='string'&&window.NATURION_BG.length===EXPECTED_BG_LENGTH){
      art.src='data:image/webp;base64,'+window.NATURION_BG;
    }else{
      loadError.hidden=false;
      document.getElementById('newJourney').disabled=true;
      document.getElementById('optionsButton').disabled=true;
      console.error('Arte da tela inicial incompleta:',window.NATURION_BG?.length,EXPECTED_BG_LENGTH);
    }

    const KEY='naturion-settings-v1';
    const modal=document.getElementById('optionsModal');
    const toastBox=document.getElementById('toast');
    const music=document.getElementById('musicVolume');
    const effects=document.getElementById('effectsVolume');
    const fullscreen=document.getElementById('fullscreen');
    let toastTimer;

    function showToast(message){toastBox.textContent=message;toastBox.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toastBox.classList.remove('show'),2600)}
    function save(){localStorage.setItem(KEY,JSON.stringify({music:+music.value,effects:+effects.value}))}
    function openOptions(){modal.hidden=false;modal.setAttribute('aria-hidden','false');document.getElementById('closeOptions').focus()}
    function closeOptions(){save();modal.hidden=true;modal.setAttribute('aria-hidden','true');document.getElementById('optionsButton').focus()}
    try{const saved=JSON.parse(localStorage.getItem(KEY)||'{}');if(Number.isFinite(saved.music))music.value=saved.music;if(Number.isFinite(saved.effects))effects.value=saved.effects}catch(error){console.warn('Falha ao carregar opções',error)}
    document.getElementById('newJourney').addEventListener('click',()=>showToast('A escolha do Naturion inicial será adicionada na próxima etapa.'));
    document.getElementById('optionsButton').addEventListener('click',openOptions);
    document.getElementById('closeOptions').addEventListener('click',closeOptions);
    modal.addEventListener('click',event=>{if(event.target===modal)closeOptions()});
    document.addEventListener('keydown',event=>{if(event.key==='Escape'&&!modal.hidden)closeOptions()});
    music.addEventListener('input',save);effects.addEventListener('input',save);
    fullscreen.addEventListener('change',async()=>{try{if(fullscreen.checked&&!document.fullscreenElement)await document.documentElement.requestFullscreen();else if(!fullscreen.checked&&document.fullscreenElement)await document.exitFullscreen()}catch(error){fullscreen.checked=!!document.fullscreenElement;showToast('O navegador não permitiu ativar a tela cheia.')}});
    document.addEventListener('fullscreenchange',()=>fullscreen.checked=!!document.fullscreenElement);
  </script>
</body>
</html>
