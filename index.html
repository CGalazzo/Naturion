<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#071018">
  <title>Naturion — Guardiões da Natureza</title>
  <style>
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#071018;color:#fff;font-family:Arial,Helvetica,sans-serif}
    body{display:grid;place-items:center}
    button,input{font:inherit}
    .stage{position:relative;width:min(100vw,calc(100vh * 16 / 9));height:min(100vh,calc(100vw * 9 / 16));aspect-ratio:16/9;overflow:hidden;background:#071018;box-shadow:0 20px 70px rgba(0,0,0,.55)}
    .art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .2s ease;user-select:none;-webkit-user-drag:none}
    .art.ready{opacity:1}
    .loading{position:absolute;inset:0;display:grid;place-items:center;padding:24px;background:linear-gradient(145deg,#123821,#071018);font-weight:900;letter-spacing:.04em;text-align:center}
    .loading[hidden]{display:none}
    .hit{position:absolute;z-index:2;border:0;border-radius:18px;background:transparent;color:transparent;font-size:0;cursor:pointer;outline:none;-webkit-tap-highlight-color:transparent}
    .hit:disabled{cursor:default}
    .hit:not(:disabled):hover,.hit:not(:disabled):focus-visible{box-shadow:inset 0 0 0 5px rgba(255,255,255,.72),0 0 30px rgba(255,225,82,.8)}
    .hit:not(:disabled):active{transform:translateY(3px)}
    #newJourney{left:35.05%;top:59.1%;width:29.25%;height:11.65%}
    #optionsButton{left:35.55%;top:74.85%;width:28.6%;height:12.1%}
    .modal[hidden]{display:none}
    .modal{position:fixed;z-index:20;inset:0;display:grid;place-items:center;padding:20px;background:rgba(0,0,0,.66);backdrop-filter:blur(6px)}
    .card{width:min(92vw,540px);padding:26px;border:2px solid #d8b94f;border-radius:22px;background:linear-gradient(#183d28,#081a11);box-shadow:0 20px 60px rgba(0,0,0,.6)}
    .card h2{margin:0 0 22px;text-align:center;color:#f2d77d}
    .setting{display:grid;gap:8px;margin:17px 0;padding:13px;border-radius:14px;background:rgba(255,255,255,.06)}
    .setting input[type=range]{width:100%;accent-color:#63a944}
    .toggle{display:flex;align-items:center;justify-content:space-between;gap:16px}
    .toggle input{width:23px;height:23px;accent-color:#63a944}
    .close{display:block;min-width:180px;margin:22px auto 0;padding:13px 28px;border:2px solid #2c641f;border-radius:13px;background:linear-gradient(#7dc84d,#34712d);color:#fff;font-weight:900;cursor:pointer;box-shadow:0 7px 0 rgba(0,0,0,.28)}
    .close:active{transform:translateY(2px);box-shadow:0 4px 0 rgba(0,0,0,.28)}
    .toast{position:fixed;z-index:30;left:50%;bottom:max(24px,env(safe-area-inset-bottom));max-width:min(90vw,560px);padding:13px 18px;border:1px solid #d8b94f;border-radius:13px;background:rgba(8,24,16,.97);font-weight:800;text-align:center;opacity:0;pointer-events:none;transform:translateX(-50%) translateY(18px);transition:.2s}
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  </style>
</head>
<body>
  <main class="stage" aria-label="Tela inicial do Naturion">
    <img id="screenArt" class="art" alt="Tela inicial de Naturion: Guardiões da Natureza">
    <div id="loading" class="loading" role="status">Carregando Naturion...</div>
    <button id="newJourney" class="hit" type="button" aria-label="Nova Jornada" disabled>Nova Jornada</button>
    <button id="optionsButton" class="hit" type="button" aria-label="Opções" disabled>Opções</button>
  </main>

  <section id="optionsModal" class="modal" hidden aria-hidden="true">
    <div class="card" role="dialog" aria-modal="true" aria-labelledby="optionsTitle">
      <h2 id="optionsTitle">Opções</h2>
      <div class="setting">
        <label for="musicVolume">Volume da música</label>
        <input id="musicVolume" type="range" min="0" max="100" value="70">
      </div>
      <div class="setting">
        <label for="effectsVolume">Volume dos efeitos</label>
        <input id="effectsVolume" type="range" min="0" max="100" value="85">
      </div>
      <div class="setting toggle">
        <label for="fullscreen">Tela cheia</label>
        <input id="fullscreen" type="checkbox">
      </div>
      <button id="closeOptions" class="close" type="button">Fechar</button>
    </div>
  </section>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
    const SETTINGS_KEY='naturion-settings-v2';
    const art=document.getElementById('screenArt');
    const loading=document.getElementById('loading');
    const newJourney=document.getElementById('newJourney');
    const optionsButton=document.getElementById('optionsButton');
    const modal=document.getElementById('optionsModal');
    const closeOptions=document.getElementById('closeOptions');
    const music=document.getElementById('musicVolume');
    const effects=document.getElementById('effectsVolume');
    const fullscreen=document.getElementById('fullscreen');
    const toastBox=document.getElementById('toast');
    let toastTimer;

    function showToast(message){
      toastBox.textContent=message;
      toastBox.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer=setTimeout(()=>toastBox.classList.remove('show'),2600);
    }

    function saveSettings(){
      localStorage.setItem(SETTINGS_KEY,JSON.stringify({music:+music.value,effects:+effects.value}));
    }

    function loadSettings(){
      try{
        const saved=JSON.parse(localStorage.getItem(SETTINGS_KEY)||'{}');
        if(Number.isFinite(saved.music)) music.value=saved.music;
        if(Number.isFinite(saved.effects)) effects.value=saved.effects;
      }catch(error){console.warn('Falha ao carregar opções.',error)}
    }

    async function loadApprovedArt(){
      try{
        const paths=[0,1,2,3,4].map(index=>`assets/start/bg${index}.txt?v=3`);
        const pieces=await Promise.all(paths.map(async path=>{
          const response=await fetch(path,{cache:'no-store'});
          if(!response.ok) throw new Error(`${path}: HTTP ${response.status}`);
          return (await response.text()).trim();
        }));
        const source='data:image/webp;base64,'+pieces.join('');
        await new Promise((resolve,reject)=>{
          art.onload=resolve;
          art.onerror=()=>reject(new Error('A imagem aprovada não pôde ser decodificada.'));
          art.src=source;
        });
        art.classList.add('ready');
        loading.hidden=true;
        newJourney.disabled=false;
        optionsButton.disabled=false;
      }catch(error){
        console.error(error);
        loading.textContent='Não foi possível carregar a arte da tela inicial. Atualize a página para tentar novamente.';
      }
    }

    function openOptions(){
      modal.hidden=false;
      modal.setAttribute('aria-hidden','false');
      closeOptions.focus();
    }

    function closeOptionsPanel(){
      saveSettings();
      modal.hidden=true;
      modal.setAttribute('aria-hidden','true');
      optionsButton.focus();
    }

    newJourney.addEventListener('click',()=>showToast('A escolha do Naturion inicial será adicionada na próxima etapa.'));
    optionsButton.addEventListener('click',openOptions);
    closeOptions.addEventListener('click',closeOptionsPanel);
    modal.addEventListener('click',event=>{if(event.target===modal) closeOptionsPanel()});
    document.addEventListener('keydown',event=>{if(event.key==='Escape'&&!modal.hidden) closeOptionsPanel()});
    music.addEventListener('input',saveSettings);
    effects.addEventListener('input',saveSettings);
    fullscreen.addEventListener('change',async()=>{
      try{
        if(fullscreen.checked&&!document.fullscreenElement) await document.documentElement.requestFullscreen();
        if(!fullscreen.checked&&document.fullscreenElement) await document.exitFullscreen();
      }catch(error){
        fullscreen.checked=!!document.fullscreenElement;
        showToast('O navegador não permitiu ativar a tela cheia.');
      }
    });
    document.addEventListener('fullscreenchange',()=>fullscreen.checked=!!document.fullscreenElement);

    loadSettings();
    loadApprovedArt();
  </script>
</body>
</html>
