<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#102d1b">
  <meta name="color-scheme" content="dark">
  <title>Naturion — Guardiões da Natureza</title>
  <link rel="preload" href="assets/start/naturion-voxel-valley.webp" as="image" type="image/webp">
  <link rel="preload" href="assets/start/naturion-logo.png" as="image" type="image/png">
  <style>
    :root {
      --gold-light: #fff8ad;
      --gold: #e8bd35;
      --gold-dark: #7c5412;
      --ink: #07150d;
      --panel: rgba(9, 35, 22, .96);
      --scene-x: 0px;
      --scene-y: 0px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      overflow: hidden;
      background: #06130d;
      color: #fff;
      font-family: "Trebuchet MS", Arial, sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    button {
      -webkit-tap-highlight-color: transparent;
    }

    .title-screen {
      position: relative;
      isolation: isolate;
      display: grid;
      min-height: 100svh;
      place-items: center;
      overflow: hidden;
    }

    .scene {
      position: absolute;
      z-index: -4;
      inset: -24px;
      width: calc(100% + 48px);
      height: calc(100% + 48px);
      object-fit: cover;
      object-position: center;
      transform: translate3d(var(--scene-x), var(--scene-y), 0) scale(1.035);
      filter: saturate(1.04) contrast(1.02);
      transition: transform 1.1s cubic-bezier(.2, .7, .2, 1);
    }

    .title-screen::before {
      position: absolute;
      z-index: -3;
      inset: 0;
      content: "";
      background:
        linear-gradient(180deg, rgba(3, 15, 9, .2), transparent 29%),
        radial-gradient(circle at 50% 26%, transparent 7%, rgba(1, 12, 7, .04) 50%, rgba(1, 10, 6, .48) 100%),
        linear-gradient(0deg, rgba(2, 12, 7, .7), transparent 45%);
      pointer-events: none;
    }

    .title-screen::after {
      position: absolute;
      z-index: -2;
      inset: 0;
      content: "";
      opacity: .14;
      background-image:
        linear-gradient(rgba(255, 255, 255, .24) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, .16) 1px, transparent 1px);
      background-size: 4px 4px;
      mix-blend-mode: soft-light;
      pointer-events: none;
    }

    .light-rays {
      position: absolute;
      z-index: -1;
      top: -35%;
      left: 8%;
      width: 52vw;
      height: 115vh;
      opacity: .2;
      transform: rotate(-19deg);
      background: linear-gradient(90deg, transparent, #fff3ad 48%, transparent 50%, #fff3ad 54%, transparent 72%);
      filter: blur(18px);
      pointer-events: none;
      animation: rays 8s ease-in-out infinite alternate;
    }

    .spark {
      position: absolute;
      z-index: 0;
      width: var(--size);
      height: var(--size);
      left: var(--left);
      bottom: -18px;
      opacity: 0;
      border: 1px solid rgba(255, 255, 190, .8);
      background: #eaff9d;
      box-shadow: 0 0 12px #bfff6f;
      transform: rotate(45deg);
      pointer-events: none;
      animation: drift var(--duration) linear var(--delay) infinite;
    }

    .content {
      position: relative;
      z-index: 2;
      display: flex;
      width: min(94vw, 1050px);
      min-height: 100svh;
      flex-direction: column;
      align-items: center;
      padding: max(3vh, env(safe-area-inset-top)) 20px max(4vh, env(safe-area-inset-bottom));
      text-align: center;
    }

    .brand {
      display: flex;
      width: 100%;
      flex-direction: column;
      align-items: center;
      animation: reveal .9s cubic-bezier(.18, .8, .24, 1) both;
    }

    .logo {
      display: block;
      width: min(73vw, 850px);
      height: auto;
      max-height: 31vh;
      object-fit: contain;
      filter:
        drop-shadow(0 6px 0 rgba(32, 20, 2, .72))
        drop-shadow(0 17px 19px rgba(0, 0, 0, .58))
        drop-shadow(0 0 17px rgba(255, 235, 101, .24));
      transform-origin: 50% 55%;
      animation: logo-float 4.6s ease-in-out 1s infinite;
    }

    .subtitle {
      margin: -1.2vh 0 0;
      padding: 8px 24px 7px;
      border: 2px solid rgba(255, 230, 112, .75);
      border-radius: 5px;
      background: linear-gradient(180deg, rgba(24, 63, 31, .94), rgba(8, 29, 17, .94));
      box-shadow:
        0 4px 0 #49300a,
        0 8px 16px rgba(0, 0, 0, .45),
        inset 0 1px rgba(255, 255, 255, .2);
      color: #fff0a3;
      font-family: ui-monospace, "Courier New", monospace;
      font-size: clamp(.66rem, 1.35vw, 1rem);
      font-weight: 900;
      letter-spacing: .23em;
      text-shadow: 2px 2px 0 #122415;
      text-transform: uppercase;
    }

    .menu {
      display: grid;
      width: min(88vw, 440px);
      gap: clamp(14px, 2vh, 21px);
      margin-top: auto;
      margin-bottom: clamp(2vh, 5vh, 8vh);
      animation: menu-rise .75s cubic-bezier(.18, .82, .25, 1) .25s both;
    }

    .pixel-button {
      --top: #6fc84b;
      --mid: #378b37;
      --bottom: #174f29;
      --edge: #112c18;
      position: relative;
      min-height: clamp(66px, 9.4vh, 88px);
      padding: 13px 28px 16px;
      border: 4px solid var(--edge);
      border-radius: 9px;
      outline: 3px solid var(--gold);
      outline-offset: -9px;
      background: linear-gradient(180deg, var(--top) 0 18%, var(--mid) 19% 76%, var(--bottom) 77% 100%);
      box-shadow:
        0 8px 0 #0a2414,
        0 13px 0 rgba(4, 12, 7, .7),
        0 20px 30px rgba(0, 0, 0, .5),
        inset 0 3px 0 rgba(255, 255, 255, .42),
        inset 0 -4px 0 rgba(0, 0, 0, .24);
      color: #fff;
      cursor: pointer;
      font-family: ui-monospace, "Courier New", monospace;
      font-size: clamp(1.14rem, 2.45vw, 1.72rem);
      font-weight: 1000;
      letter-spacing: .075em;
      line-height: 1;
      text-shadow:
        3px 3px 0 rgba(4, 32, 13, .9),
        -1px -1px 0 rgba(255, 255, 255, .12);
      text-transform: uppercase;
      transition: transform .13s ease, filter .13s ease, box-shadow .13s ease;
    }

    .pixel-button::before,
    .pixel-button::after {
      position: absolute;
      top: 50%;
      width: 8px;
      height: 8px;
      content: "";
      background: var(--gold-light);
      box-shadow: 0 0 9px rgba(255, 242, 130, .8);
      transform: translateY(-50%) rotate(45deg);
    }

    .pixel-button::before {
      left: 20px;
    }

    .pixel-button::after {
      right: 20px;
    }

    .pixel-button.secondary {
      --top: #55b6d9;
      --mid: #2779af;
      --bottom: #173d77;
      --edge: #102948;
    }

    .pixel-button:hover,
    .pixel-button:focus-visible {
      filter: brightness(1.13) saturate(1.08);
      transform: translateY(-3px) scale(1.018);
      box-shadow:
        0 11px 0 #0a2414,
        0 16px 0 rgba(4, 12, 7, .68),
        0 24px 36px rgba(0, 0, 0, .54),
        0 0 24px rgba(255, 235, 105, .28),
        inset 0 3px 0 rgba(255, 255, 255, .5),
        inset 0 -4px 0 rgba(0, 0, 0, .24);
    }

    .pixel-button:active,
    .pixel-button.is-pressed {
      transform: translateY(7px);
      box-shadow:
        0 1px 0 #0a2414,
        0 4px 10px rgba(0, 0, 0, .45),
        inset 0 3px 7px rgba(0, 0, 0, .28);
    }

    .version {
      position: absolute;
      z-index: 4;
      bottom: max(12px, env(safe-area-inset-bottom));
      left: max(14px, env(safe-area-inset-left));
      margin: 0;
      color: rgba(255, 255, 255, .7);
      font: 800 .7rem/1 ui-monospace, "Courier New", monospace;
      letter-spacing: .08em;
      text-shadow: 2px 2px 0 #000;
    }

    .asset-error[hidden] {
      display: none;
    }

    .asset-error {
      position: fixed;
      z-index: 40;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 28px;
      background: linear-gradient(145deg, #123821, #06150d);
      text-align: center;
    }

    .asset-error p {
      width: min(92vw, 560px);
      margin: 0;
      padding: 24px;
      border: 3px solid var(--gold);
      border-radius: 8px;
      background: rgba(4, 20, 11, .9);
      box-shadow: 0 8px 0 #071009;
      color: #fff0a4;
      font-family: ui-monospace, "Courier New", monospace;
      font-weight: 900;
      line-height: 1.6;
    }

    .modal[hidden] {
      display: none;
    }

    .modal {
      position: fixed;
      z-index: 20;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 20px;
      background: rgba(0, 10, 6, .72);
      backdrop-filter: blur(7px);
      animation: fade-in .18s ease-out both;
    }

    .options-card {
      position: relative;
      width: min(92vw, 540px);
      max-height: min(90svh, 680px);
      overflow: auto;
      padding: 28px clamp(20px, 5vw, 40px) 32px;
      border: 4px solid #19351f;
      border-radius: 11px;
      outline: 4px solid var(--gold);
      outline-offset: -11px;
      background:
        linear-gradient(rgba(255, 255, 255, .03) 50%, transparent 50%) 0 0 / 100% 6px,
        linear-gradient(145deg, rgba(35, 94, 50, .98), var(--panel));
      box-shadow:
        0 11px 0 rgba(4, 18, 9, .92),
        0 26px 70px rgba(0, 0, 0, .7),
        inset 0 3px rgba(255, 255, 255, .12);
      animation: card-in .25s cubic-bezier(.18, .8, .22, 1) both;
    }

    .options-card h2 {
      margin: 0 0 26px;
      color: #fff2a8;
      font-family: ui-monospace, "Courier New", monospace;
      font-size: clamp(1.5rem, 5vw, 2.1rem);
      letter-spacing: .09em;
      text-align: center;
      text-shadow: 3px 3px 0 #3a2709;
      text-transform: uppercase;
    }

    .setting {
      display: grid;
      gap: 10px;
      margin: 14px 0;
      padding: 15px 17px;
      border: 2px solid rgba(239, 208, 81, .38);
      border-radius: 7px;
      background: rgba(2, 16, 9, .48);
      font-weight: 800;
    }

    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .value {
      min-width: 3ch;
      color: #fff0a4;
      font-family: ui-monospace, "Courier New", monospace;
      text-align: right;
    }

    input[type="range"] {
      width: 100%;
      height: 8px;
      border-radius: 0;
      accent-color: #e4c143;
      cursor: pointer;
    }

    input[type="checkbox"] {
      width: 23px;
      height: 23px;
      flex: 0 0 auto;
      accent-color: #dabb3f;
      cursor: pointer;
    }

    .close-button {
      display: block;
      min-width: 180px;
      margin: 25px auto 0;
      padding: 13px 24px 15px;
      border: 3px solid #142d1b;
      border-radius: 6px;
      outline: 2px solid #e8c54e;
      outline-offset: -7px;
      background: linear-gradient(#68b649, #2e7233);
      box-shadow: 0 5px 0 #0c2714;
      color: #fff;
      cursor: pointer;
      font-family: ui-monospace, "Courier New", monospace;
      font-weight: 1000;
      letter-spacing: .06em;
      text-shadow: 2px 2px 0 #17381c;
      text-transform: uppercase;
    }

    .close-button:hover,
    .close-button:focus-visible {
      filter: brightness(1.14);
    }

    .toast {
      position: fixed;
      z-index: 30;
      bottom: max(24px, calc(env(safe-area-inset-bottom) + 12px));
      left: 50%;
      width: max-content;
      max-width: min(90vw, 620px);
      padding: 13px 20px;
      border: 2px solid var(--gold);
      border-radius: 6px;
      background: rgba(7, 30, 17, .96);
      box-shadow: 0 7px 0 rgba(3, 14, 8, .8), 0 16px 32px rgba(0, 0, 0, .45);
      font-family: ui-monospace, "Courier New", monospace;
      font-size: clamp(.78rem, 2.5vw, .98rem);
      font-weight: 900;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 22px);
      transition: opacity .2s ease, transform .2s ease;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    body.no-motion *,
    body.no-motion *::before,
    body.no-motion *::after {
      scroll-behavior: auto !important;
      animation-duration: .001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .001ms !important;
    }

    @keyframes reveal {
      from { opacity: 0; transform: translateY(-24px) scale(.96); }
      to { opacity: 1; transform: none; }
    }

    @keyframes menu-rise {
      from { opacity: 0; transform: translateY(35px); }
      to { opacity: 1; transform: none; }
    }

    @keyframes logo-float {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-7px) scale(1.006); }
    }

    @keyframes rays {
      from { opacity: .12; transform: translateX(-3vw) rotate(-19deg); }
      to { opacity: .25; transform: translateX(3vw) rotate(-17deg); }
    }

    @keyframes drift {
      0% { opacity: 0; transform: translateY(0) rotate(45deg) scale(.55); }
      12%, 68% { opacity: .72; }
      100% { opacity: 0; transform: translateY(-105vh) rotate(225deg) scale(1.15); }
    }

    @keyframes fade-in {
      from { opacity: 0; }
    }

    @keyframes card-in {
      from { opacity: 0; transform: translateY(18px) scale(.96); }
    }

    @media (max-aspect-ratio: 4/5) {
      .content {
        width: 100%;
        padding-top: max(8vh, env(safe-area-inset-top));
      }

      .scene {
        object-position: 52% center;
      }

      .logo {
        width: min(96vw, 720px);
        max-height: 25vh;
      }

      .subtitle {
        margin-top: 0;
        padding-inline: 14px;
        letter-spacing: .14em;
      }

      .menu {
        width: min(88vw, 430px);
        margin-bottom: clamp(5vh, 10vh, 13vh);
      }
    }

    @media (max-height: 620px) and (min-aspect-ratio: 6/5) {
      .content {
        padding-top: 8px;
        padding-bottom: 12px;
      }

      .logo {
        width: min(58vw, 680px);
        max-height: 29vh;
      }

      .subtitle {
        padding-block: 5px;
      }

      .menu {
        width: min(42vw, 390px);
        gap: 12px;
        margin-bottom: 3vh;
      }

      .pixel-button {
        min-height: 58px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .001ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="title-screen" id="titleScreen" aria-label="Tela inicial do Naturion">
    <img
      class="scene"
      src="assets/start/naturion-voxel-valley.webp"
      alt=""
      width="1920"
      height="1080"
      fetchpriority="high"
    >
    <div class="light-rays" aria-hidden="true"></div>
    <i class="spark" aria-hidden="true" style="--left:11%;--size:7px;--duration:10s;--delay:-6s"></i>
    <i class="spark" aria-hidden="true" style="--left:24%;--size:5px;--duration:12s;--delay:-2s"></i>
    <i class="spark" aria-hidden="true" style="--left:68%;--size:6px;--duration:11s;--delay:-8s"></i>
    <i class="spark" aria-hidden="true" style="--left:82%;--size:8px;--duration:13s;--delay:-4s"></i>
    <i class="spark" aria-hidden="true" style="--left:92%;--size:4px;--duration:9s;--delay:-1s"></i>

    <div class="content">
      <header class="brand">
        <img
          class="logo"
          src="assets/start/naturion-logo.png"
          alt="Naturion"
          width="1029"
          height="327"
        >
        <p class="subtitle">Guardiões da Natureza</p>
      </header>

      <nav class="menu" aria-label="Menu principal">
        <button class="pixel-button" id="newJourney" type="button">Nova Jornada</button>
        <button class="pixel-button secondary" id="optionsButton" type="button">Opções</button>
      </nav>
    </div>

    <p class="version">ALPHA v0.2.0</p>
  </main>

  <aside class="asset-error" id="assetError" role="alert" hidden>
    <p>Não foi possível carregar a arte da tela inicial.<br>Atualize a página para tentar novamente.</p>
  </aside>

  <section class="modal" id="optionsModal" role="dialog" aria-modal="true" aria-labelledby="optionsTitle" hidden>
    <div class="options-card">
      <h2 id="optionsTitle">Opções</h2>

      <label class="setting" for="musicVolume">
        <span class="setting-row">
          <span>Volume da música</span>
          <output class="value" id="musicValue">70</output>
        </span>
        <input id="musicVolume" type="range" min="0" max="100" value="70">
      </label>

      <label class="setting" for="effectsVolume">
        <span class="setting-row">
          <span>Volume dos efeitos</span>
          <output class="value" id="effectsValue">85</output>
        </span>
        <input id="effectsVolume" type="range" min="0" max="100" value="85">
      </label>

      <label class="setting setting-row" for="fullscreen">
        <span>Tela cheia</span>
        <input id="fullscreen" type="checkbox">
      </label>

      <label class="setting setting-row" for="motion">
        <span>Animações</span>
        <input id="motion" type="checkbox" checked>
      </label>

      <button class="close-button" id="closeOptions" type="button">Concluído</button>
    </div>
  </section>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    (() => {
      const STORAGE_KEY = "naturion-settings-v2";
      const screen = document.getElementById("titleScreen");
      const sceneImage = document.querySelector(".scene");
      const logoImage = document.querySelector(".logo");
      const assetError = document.getElementById("assetError");
      const modal = document.getElementById("optionsModal");
      const optionsButton = document.getElementById("optionsButton");
      const closeButton = document.getElementById("closeOptions");
      const newJourneyButton = document.getElementById("newJourney");
      const toastBox = document.getElementById("toast");
      const musicVolume = document.getElementById("musicVolume");
      const effectsVolume = document.getElementById("effectsVolume");
      const musicValue = document.getElementById("musicValue");
      const effectsValue = document.getElementById("effectsValue");
      const fullscreen = document.getElementById("fullscreen");
      const motion = document.getElementById("motion");
      let toastTimer;
      let audioContext;

      const showAssetError = () => {
        assetError.hidden = false;
        newJourneyButton.disabled = true;
        optionsButton.disabled = true;
      };

      [sceneImage, logoImage].forEach((image) => {
        image.addEventListener("error", showAssetError, { once: true });
        if (image.complete && image.naturalWidth === 0) showAssetError();
      });

      const readSettings = () => {
        try {
          return JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
        } catch {
          return {};
        }
      };

      const updateLabels = () => {
        musicValue.value = musicVolume.value;
        musicValue.textContent = musicVolume.value;
        effectsValue.value = effectsVolume.value;
        effectsValue.textContent = effectsVolume.value;
      };

      const saveSettings = () => {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          music: Number(musicVolume.value),
          effects: Number(effectsVolume.value),
          motion: motion.checked
        }));
        document.body.classList.toggle("no-motion", !motion.checked);
        updateLabels();
      };

      const settings = readSettings();
      if (Number.isFinite(settings.music)) musicVolume.value = settings.music;
      if (Number.isFinite(settings.effects)) effectsVolume.value = settings.effects;
      if (typeof settings.motion === "boolean") motion.checked = settings.motion;
      saveSettings();

      const playClick = (pitch = 310) => {
        if (Number(effectsVolume.value) === 0) return;
        try {
          audioContext ||= new (window.AudioContext || window.webkitAudioContext)();
          const oscillator = audioContext.createOscillator();
          const gain = audioContext.createGain();
          const now = audioContext.currentTime;
          oscillator.type = "square";
          oscillator.frequency.setValueAtTime(pitch, now);
          oscillator.frequency.exponentialRampToValueAtTime(pitch * 1.24, now + .065);
          gain.gain.setValueAtTime(Math.min(.055, Number(effectsVolume.value) / 1800), now);
          gain.gain.exponentialRampToValueAtTime(.0001, now + .08);
          oscillator.connect(gain).connect(audioContext.destination);
          oscillator.start(now);
          oscillator.stop(now + .085);
        } catch {
          // Som é opcional; a interface continua funcional sem Web Audio.
        }
      };

      const showToast = (message) => {
        toastBox.textContent = message;
        toastBox.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toastBox.classList.remove("show"), 2600);
      };

      const openOptions = () => {
        playClick(260);
        modal.hidden = false;
        requestAnimationFrame(() => closeButton.focus());
      };

      const closeOptions = () => {
        saveSettings();
        playClick(220);
        modal.hidden = true;
        optionsButton.focus();
      };

      newJourneyButton.addEventListener("click", () => {
        playClick(390);
        newJourneyButton.classList.add("is-pressed");
        window.setTimeout(() => newJourneyButton.classList.remove("is-pressed"), 170);
        window.dispatchEvent(new CustomEvent("naturion:new-journey"));
        showToast("Nova Jornada selecionada!");
      });

      optionsButton.addEventListener("click", openOptions);
      closeButton.addEventListener("click", closeOptions);

      modal.addEventListener("click", (event) => {
        if (event.target === modal) closeOptions();
      });

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && !modal.hidden) closeOptions();
      });

      [musicVolume, effectsVolume].forEach((input) => {
        input.addEventListener("input", saveSettings);
        input.addEventListener("change", () => playClick(300));
      });

      motion.addEventListener("change", () => {
        saveSettings();
        playClick(330);
      });

      fullscreen.addEventListener("change", async () => {
        playClick(330);
        try {
          if (fullscreen.checked && !document.fullscreenElement) {
            await document.documentElement.requestFullscreen();
          } else if (!fullscreen.checked && document.fullscreenElement) {
            await document.exitFullscreen();
          }
        } catch {
          fullscreen.checked = Boolean(document.fullscreenElement);
          showToast("O navegador não permitiu ativar a tela cheia.");
        }
      });

      document.addEventListener("fullscreenchange", () => {
        fullscreen.checked = Boolean(document.fullscreenElement);
      });

      screen.addEventListener("pointermove", (event) => {
        if (!motion.checked || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
        const x = (event.clientX / innerWidth - .5) * -10;
        const y = (event.clientY / innerHeight - .5) * -7;
        screen.style.setProperty("--scene-x", `${x}px`);
        screen.style.setProperty("--scene-y", `${y}px`);
      }, { passive: true });

      screen.addEventListener("pointerleave", () => {
        screen.style.setProperty("--scene-x", "0px");
        screen.style.setProperty("--scene-y", "0px");
      });
    })();
  </script>
</body>
</html>
