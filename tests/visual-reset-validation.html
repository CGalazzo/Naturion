<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><base href="/"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Validação visual reset</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#173d33}#viewport{width:1280px;height:720px}#result{position:fixed;left:8px;top:8px;z-index:20;background:#fff;color:#111;padding:9px;white-space:pre;font:13px monospace}canvas{image-rendering:pixelated}</style></head><body data-test-status="running"><div id="viewport"></div><pre id="result">running</pre><script type="module">
import { OverworldEngine,THREE } from './src/overworld/engine.js';import { OverworldCamera } from './src/overworld/camera.js';import { OverworldPlayer } from './src/overworld/player.js';import { OverworldEntities } from './src/overworld/entities.js';import { collectOverworldMetrics } from './src/overworld/rendering/performance-metrics.js';import { bosqueLuminalMap,buildBosqueLuminal,bosqueLuminalNpcs,bosqueLuminalNaturions } from './src/overworld/maps/bosque-luminal.js';
const result=document.getElementById('result');const assert=(v,m)=>{if(!v)throw new Error(m)};const loadImage=src=>new Promise((resolve,reject)=>{const image=new Image();image.onload=()=>resolve(image);image.onerror=()=>reject(new Error('Falha ao carregar '+src));image.src=src});const pixel='data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVQIHWP4z8DwHwAFgAI/ScL5WQAAAABJRU5ErkJggg==';
try{const assets=[['assets/overworld/visual-reset/validation/validation-ground.webp',1024,1024],['assets/overworld/visual-reset/validation/validation-occlusion.png',1024,256],['assets/overworld/visual-reset/validation/validation-effects.png',512,128],['assets/overworld/visual-reset/validation/contact-shadow.png',128,64],['assets/overworld/visual-reset/validation/hero-male.png',704,640],['assets/overworld/visual-reset/validation/hero-female.png',704,640],['assets/overworld/visual-reset/validation/npc-atlas.png',256,240]];const images=await Promise.all(assets.map(([src])=>loadImage(src)));images.forEach((image,i)=>assert(image.naturalWidth===assets[i][1]&&image.naturalHeight===assets[i][2],'Dimensão incorreta '+assets[i][0]));
const engine=new OverworldEngine({container:document.getElementById('viewport'),map:bosqueLuminalMap});const world=buildBosqueLuminal({scene:engine.scene,engine});const camera=new OverworldCamera({engine,map:bosqueLuminalMap});const movement={x:0,z:0,running:false};const player=new OverworldPlayer({scene:engine.scene,collision:world.collision,input:{getMovement:()=>movement},characterImage:'assets/selection/hero-male.webp',startPosition:bosqueLuminalMap.startPosition});camera.setPlayerObject(player.group);const forms={escaruli:{name:'Escaruli',image:pixel},zumbel:{name:'Zumbel',image:pixel},failino:{name:'Failino',image:pixel}};const entities=new OverworldEntities({scene:engine.scene,collision:world.collision,forms,onEncounter:async()=>({outcome:'fled'}),onDialogue:()=>{}});entities.spawn({naturions:bosqueLuminalNaturions,npcs:bosqueLuminalNpcs});
const all=()=>engine.scene.children.flatMap(function walk(o){return[o,...o.children.flatMap(walk)]});assert(engine.renderer.getPixelRatio()===1,'Pixel ratio');assert(!engine.renderer.shadowMap.enabled,'Sombras em tempo real ainda ligadas');assert(all().filter(o=>o.isLight).length===0,'Luzes caras ainda presentes');assert(engine.scene.getObjectByName('BosqueLuminalVisualResetValidation'),'Raiz da validação ausente');assert(engine.scene.getObjectByName('BosqueValidationGround'),'Chão da validação ausente');assert(engine.scene.getObjectByName('BosqueValidationLocalEffect'),'Efeito local ausente');assert(all().filter(o=>String(o.name).startsWith('ValidationOccluder-')).length===4,'Oclusores incorretos');assert(all().filter(o=>String(o.name).startsWith('BosqueForegroundStrip-')).length===0,'Faixas antigas ainda presentes');assert(player.rig.sprite instanceof THREE.Sprite,'Protagonista direcional ausente');assert(entities.npcs.length===3&&entities.naturions.length===3,'Entidades perdidas');assert(world.interactions.length>=6,'Interações perdidas');assert(world.collision.collides(-9,5,.56),'Casa oeste');assert(world.collision.collides(9,1,.56),'Casa leste');assert(world.collision.collides(-17,-5,.56),'Água');assert(world.collision.collides(0,-20,.56),'Portão');
const startX=player.group.position.x;movement.x=1;for(let i=0;i<60;i++)player.update(1/60,i/60);const walk=player.group.position.x-startX;player.teleport(bosqueLuminalMap.startPosition);movement.running=true;for(let i=0;i<60;i++)player.update(1/60,i/60);const run=player.group.position.x-bosqueLuminalMap.startPosition.x;assert(walk>1&&run>walk,'Caminhada/corrida');movement.x=0;movement.running=false;
for(let i=0;i<30;i++){const move=player.update(1/60,i/60);camera.update(1/60,move.velocity);entities.update(1/60,i/60,player.group.position);engine.updaters.forEach(fn=>fn(1/60,i/60));engine.renderer.render(engine.scene,camera.camera)}const frames=180,start=performance.now();for(let i=0;i<frames;i++){const elapsed=i/60;const move=player.update(1/60,elapsed);camera.update(1/60,move.velocity);entities.update(1/60,elapsed,player.group.position);engine.updaters.forEach(fn=>fn(1/60,elapsed));engine.renderer.render(engine.scene,camera.camera)}const total=performance.now()-start;const metrics=collectOverworldMetrics(engine,{syntheticFps:Number((frames/(total/1000)).toFixed(2)),frameMs:Number((total/frames).toFixed(3)),sceneObjects:all().length,foregroundStrips:0,heapMB:performance.memory?Number((performance.memory.usedJSHeapSize/1048576).toFixed(2)):null,walk:Number(walk.toFixed(2)),run:Number(run.toFixed(2))});assert(metrics.drawCalls<60,'Draw calls acima da meta');document.body.dataset.testStatus='passed';result.textContent=JSON.stringify(metrics,null,2);console.log('NATURION_METRICS '+JSON.stringify(metrics));}catch(error){document.body.dataset.testStatus='failed';result.textContent=error.stack||error.message;console.error(error)}</script></body></html>
