<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><style>
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#315f53}#openForestMap{position:absolute;inset:0}.overworld-screen{position:absolute;inset:0}.overworld-viewport{position:absolute;inset:0}.overworld-canvas{width:100%;height:100%;image-rendering:pixelated}[hidden]{display:none!important}#testView{position:absolute;left:-2000px;width:800px;height:450px}.overworld-team-panel,.overworld-dialogue{position:absolute;inset:0}
</style></head>
<body>
<div id="openForestMap"></div><button id="worldFirstDestination" type="button">Destino</button>
<section id="overworldScreen" class="overworld-screen" hidden>
<div id="overworldViewport" class="overworld-viewport" tabindex="0"></div>
<span id="overworldObjective"></span><span id="overworldInteraction" hidden></span><span id="overworldMovementState"></span>
<button id="overworldBackMap"></button><button id="overworldTeamButton"></button>
<div id="overworldJoystick"><span id="overworldJoystickKnob"></span></div>
<button id="overworldMobileInteract"></button><button id="overworldMobileRun"></button><button id="overworldMobileTeam"></button><button id="overworldMobileMap"></button>
<section id="overworldTeamPanel" class="overworld-team-panel" hidden><article><button id="overworldTeamClose"></button><div id="overworldTeamGrid"></div></article></section>
<section id="overworldDialogue" class="overworld-dialogue" hidden><article><strong id="overworldDialogueName"></strong><p id="overworldDialogueText"></p><button id="overworldDialogueClose"></button></article></section>
</section>
<div id="toast"></div><div id="testView"></div><pre id="result"></pre>
<script type="module" src="./overworld-smoke.mjs"></script>
</body></html>
