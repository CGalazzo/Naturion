<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <base href="/">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Smoke test Bosque Luminal</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#173d33}
    #viewport{width:1280px;height:720px}
    #result{position:fixed;left:8px;top:8px;z-index:20;background:#fff;color:#111;padding:8px;font:14px monospace}
    canvas{image-rendering:pixelated}
  </style>
</head>
<body data-test-status="running">
  <div id="viewport"></div><pre id="result">running</pre>
  <script type="module">
    import { OverworldEngine, THREE } from './src/overworld/engine.js';
    import { OverworldCamera } from './src/overworld/camera.js';
    import { OverworldPlayer } from './src/overworld/player.js';
    import { OverworldEntities } from './src/overworld/entities.js';
    import { bosqueLuminalMap, buildBosqueLuminal, bosqueLuminalNpcs, bosqueLuminalNaturions } from './src/overworld/maps/bosque-luminal.js';

    const result = document.getElementById('result');
    const assert = (condition, message) => { if (!condition) throw new Error(message); };
    const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
    const loadImage = (src) => new Promise((resolve, reject) => {
      const image = new Image();
      image.onload = () => resolve({ src, width: image.naturalWidth, height: image.naturalHeight });
      image.onerror = () => reject(new Error(`Falha ao carregar ${src}`));
      image.src = src;
    });

    try {
      const expectedImages = [
        ['assets/overworld/bosque-luminal/ground.webp', 2048, 1536],
        ['assets/overworld/bosque-luminal/foreground.webp', 2048, 1536],
        ['assets/overworld/bosque-luminal/shadows.webp', 2048, 1536],
        ['assets/overworld/bosque-luminal/water-frames.webp', 2048, 6144],
        ['assets/overworld/bosque-luminal/grass-frames.webp', 2048, 6144],
        ['assets/overworld/bosque-luminal/effects.webp', 2048, 6144],
        ['assets/overworld/characters/hero-male/hero-male-sheet.png', 704, 640],
        ['assets/overworld/characters/hero-female/hero-female-sheet.png', 704, 640],
        ['assets/overworld/characters/npcs/npc-sheet.png', 256, 960]
      ];
      const loaded = await Promise.all(expectedImages.map(([src]) => loadImage(src)));
      loaded.forEach((image, index) => {
        const [, width, height] = expectedImages[index];
        assert(image.width === width && image.height === height, `Dimensão incorreta: ${image.src}`);
      });

      const viewport = document.getElementById('viewport');
      const engine = new OverworldEngine({ container: viewport, map: bosqueLuminalMap });
      const world = buildBosqueLuminal({ scene: engine.scene, engine });
      const camera = new OverworldCamera({ engine, map: bosqueLuminalMap });
      const movement = { x: 0, z: 0, running: false };
      const player = new OverworldPlayer({
        scene: engine.scene,
        collision: world.collision,
        input: { getMovement: () => movement },
        characterImage: 'assets/selection/hero-male.webp',
        startPosition: bosqueLuminalMap.startPosition
      });
      camera.setPlayerObject(player.group);

      assert(engine.renderer.getContext(), 'Contexto WebGL ausente');
      assert(engine.renderer.getPixelRatio() === 1, 'Pixel ratio diferente de 1');
      assert(engine.renderResolution.width === 800 && engine.renderResolution.height === 450, 'Resolução interna desktop incorreta');
      assert(engine.scene.getObjectByName('BosqueLuminalPrerenderedLayers'), 'Raiz das camadas não criada');
      assert(engine.scene.getObjectByName('BosqueGround'), 'Camada de chão ausente');
      assert(engine.scene.getObjectByName('BosquePaintedShadows'), 'Camada de sombras ausente');
      assert(engine.scene.getObjectByName('BosqueWaterAnimation'), 'Camada de água ausente');
      assert(engine.scene.getObjectByName('BosqueGrassAnimation'), 'Camada de grama ausente');
      assert(engine.scene.getObjectByName('BosqueForegroundStrip-0'), 'Primeiro plano fatiado ausente');
      assert(engine.scene.getObjectByName('BosqueForegroundStrip-31'), 'Primeiro plano incompleto');
      assert(player.rig.sprite instanceof THREE.Sprite, 'Protagonista não é sprite direcional');

      assert(world.collision.collides(-9, 5, .56), 'Colisão da casa oeste falhou');
      assert(world.collision.collides(9, 1, .56), 'Colisão da casa leste falhou');
      assert(world.collision.collides(-17, -5, .56), 'Colisão da água falhou');
      assert(world.collision.collides(0, -20, .56), 'Colisão do portão falhou');
      assert(world.interactions.length >= 6, 'Interações do mapa foram perdidas');

      const startX = player.group.position.x;
      movement.x = 1;
      for (let index = 0; index < 60; index += 1) player.update(1 / 60, index / 60);
      const walkDistance = player.group.position.x - startX;
      assert(walkDistance > 1, 'Caminhada não moveu o protagonista');
      player.teleport(bosqueLuminalMap.startPosition);
      movement.running = true;
      for (let index = 0; index < 60; index += 1) player.update(1 / 60, index / 60);
      const runDistance = player.group.position.x - bosqueLuminalMap.startPosition.x;
      assert(runDistance > walkDistance, 'Corrida não é mais rápida que caminhada');
      movement.x = 0;
      movement.running = false;

      const pixel = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVQIHWP4z8DwHwAFgAI/ScL5WQAAAABJRU5ErkJggg==';
      const forms = {
        escaruli: { name: 'Escaruli', image: pixel },
        zumbel: { name: 'Zumbel', image: pixel },
        failino: { name: 'Failino', image: pixel }
      };
      let dialogueCount = 0;
      const entities = new OverworldEntities({
        scene: engine.scene,
        collision: world.collision,
        forms,
        onEncounter: async () => ({ outcome: 'fled' }),
        onDialogue: () => { dialogueCount += 1; }
      });
      entities.spawn({ naturions: bosqueLuminalNaturions, npcs: bosqueLuminalNpcs });
      assert(entities.naturions.length === 3, 'Os três Naturions não foram criados');
      assert(entities.npcs.length === 3, 'Os três NPCs não foram criados');
      entities.update(1 / 60, 1, { x: -2.8, z: 16 });
      await entities.interact();
      assert(dialogueCount === 1, 'Interação com NPC falhou');

      camera.update(1 / 60, player.velocity);
      engine.renderer.render(engine.scene, camera.camera);
      await wait(500);
      engine.renderer.render(engine.scene, camera.camera);

      document.body.dataset.testStatus = 'passed';
      result.textContent = `passed\nassets=${loaded.length}\ninteractions=${world.interactions.length}\nwalk=${walkDistance.toFixed(2)}\nrun=${runDistance.toFixed(2)}`;
      window.__NATURION_SMOKE__ = { passed: true, walkDistance, runDistance };
    } catch (error) {
      document.body.dataset.testStatus = 'failed';
      result.textContent = `failed\n${error.stack || error.message}`;
      console.error(error);
    }
  </script>
</body>
</html>
