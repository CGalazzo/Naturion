name: Aplicar visual voxel em blocos

on:
  push:
    branches:
      - change/voxel-blocks-clareira

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[voxel-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar e validar conversão voxel
        run: bash scripts/apply-voxel-blocks.sh
