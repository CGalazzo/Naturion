name: Overworld 3D smoke

on:
  push:
    branches:
      - fix/restore-and-improve-3d-pixel-art
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validar sintaxe
        run: |
          node --check src/overworld/textures.js
          node --check src/overworld/sprites.js
          node --check src/overworld/environment.js
          node --check src/overworld/player.js
          ! grep -R "hero-male-sheet\|hero-female-sheet\|npc-sheet\|environment-atlas\|tiles-atlas" src/overworld
      - name: Instalar Chromium
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y chromium-browser || sudo apt-get install -y chromium
      - name: Executar smoke test WebGL
        run: |
          python3 -m http.server 4173 > /tmp/naturion-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          CHROME=$(command -v chromium-browser || command -v chromium)
          "$CHROME" \
            --headless \
            --no-sandbox \
            --disable-dev-shm-usage \
            --ignore-gpu-blocklist \
            --enable-webgl \
            --use-angle=swiftshader \
            --enable-unsafe-swiftshader \
            --virtual-time-budget=6000 \
            --dump-dom \
            http://127.0.0.1:4173/tests/overworld-3d-smoke.html \
            > /tmp/overworld-dom.txt 2> /tmp/overworld-chrome.log
          cat /tmp/overworld-dom.txt
          if ! grep -q "OVERWORLD_3D_SMOKE_OK" /tmp/overworld-dom.txt; then
            cat /tmp/overworld-chrome.log
            exit 1
          fi
