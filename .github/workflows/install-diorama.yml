name: Instalar primeira fase em diorama 3D

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build-diorama:
    if: github.head_ref == 'feature/diorama-forest-desktop'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Integrar diorama ao jogo
        run: python .github/scripts/install_diorama.py

      - name: Validar JavaScript modular
        run: |
          node --check src/diorama/engine.js
          node --check src/diorama/input-controller.js
          node --check src/diorama/player-controller.js
          node --check src/diorama/entity-system.js
          node --check src/diorama/battle-bridge.js
          node --check src/diorama/stages/bosque-clareira.js
          node --check src/diorama/main.js

      - name: Validar JavaScript existente
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script>(.*?)</script>', text, re.S)
          assert scripts, 'Script principal não encontrado'
          Path('/tmp/naturion-main.js').write_text(scripts[-1], encoding='utf-8')
          PY
          node --check /tmp/naturion-main.js

      - name: Validar integração e escopo
        run: |
          python - <<'PY'
          from pathlib import Path
          index = Path('index.html').read_text(encoding='utf-8')
          main = Path('src/diorama/main.js').read_text(encoding='utf-8')
          stage = Path('src/diorama/stages/bosque-clareira.js').read_text(encoding='utf-8')
          css = Path('styles/diorama.css').read_text(encoding='utf-8')
          assert 'id="dioramaScreen"' in index
          assert 'src/diorama/main.js' in index
          assert 'styles/diorama.css' in index
          assert 'const ECHO_AREAS = [];' in index
          assert 'window.NaturionDioramaBridge' in index
          assert 'startDioramaLegacyBattle' in index
          assert 'world-first-destination unlocked' in index
          assert 'data-world-destination="clareira-dos-ecos"' in index
          assert 'Shift' in main and 'WASD' in main
          assert 'joystick' not in main.lower()
          assert 'walkableZones' in stage and 'blockedGate' in stage
          assert 'diorama-team-panel' in css
          assert index.count('id="dioramaScreen"') == 1
          print('Diorama desktop, batalha legada e mapa-múndi integrados.')
          PY

      - name: Remover arquivos temporários de instalação
        run: git rm .github/scripts/install_diorama.py .github/workflows/install-diorama.yml

      - name: Confirmar arquivos finais permitidos
        run: |
          python - <<'PY'
          import subprocess
          allowed = {
            'index.html',
            'styles/diorama.css',
            'src/diorama/engine.js',
            'src/diorama/input-controller.js',
            'src/diorama/player-controller.js',
            'src/diorama/entity-system.js',
            'src/diorama/battle-bridge.js',
            'src/diorama/main.js',
            'src/diorama/stages/bosque-clareira.js',
          }
          changed = set(subprocess.check_output(['git', 'diff', '--name-only', 'origin/main'], text=True).splitlines())
          unexpected = changed - allowed
          assert not unexpected, f'Arquivos inesperados: {sorted(unexpected)}'
          assert changed == allowed, f'Arquivos esperados ausentes: {sorted(allowed - changed)}'
          print('\n'.join(sorted(changed)))
          PY

      - name: Gravar implementação na branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: criar primeira fase em diorama 3D desktop"
          git push origin HEAD:${{ github.head_ref }}
