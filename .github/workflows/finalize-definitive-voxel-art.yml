name: Finalizar arte voxel da Clareira

on:
  push:
    branches:
      - change/definitive-voxel-art-pass
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate-and-capture:
    if: ${{ github.event_name == 'pull_request' || !contains(github.event.head_commit.message, '[art-pass-complete]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          ref: change/definitive-voxel-art-pass
          fetch-depth: 0

      - name: Preparar validação gráfica
        run: |
          sed -i 's/--use-gl=swiftshader/--use-gl=angle --use-angle=swiftshader/g' scripts/finalize-definitive-voxel-art.sh
          python3 <<'PY'
          from pathlib import Path
          path = Path('src/diorama/art/voxel-clareira-composition.js')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'arena: [[28, -2, 1.02, "common", 2.6], [31, 7, 1.12, "ancient", 0.6], [34, -14, 1.05, "common", 2.1]],',
              'arena: [[28, -2, 1.02, "common", 2.6], [31, 7, 1.12, "ancient", 0.6]],'
          )
          text = text.replace(
              '[8, 18.5, 0.96, "common", 2.9], [16, 20, 0.78, "young", 1.2], [-34, -2, 1.05, "ancient", 0.4]',
              '[8, 18.5, 0.96, "common", 2.9], [16, 20, 0.78, "young", 1.2], [-34, -2, 1.05, "ancient", 0.4], [34, -14, 1.05, "common", 2.1]'
          )
          path.write_text(text, encoding='utf-8')
          PY

      - name: Finalizar, testar e capturar a Clareira
        run: bash scripts/finalize-definitive-voxel-art.sh

      - name: Exibir diagnóstico em caso de falha
        if: failure()
        run: |
          for file in /tmp/chrome-*.log /tmp/chrome-shot-*.log /tmp/naturion-http-*.log /tmp/naturion-integration-http.log /tmp/integration-chrome.log /tmp/*-dom.html; do
            if [ -f "$file" ]; then
              echo "===== $file ====="
              tail -n 160 "$file"
            fi
          done
