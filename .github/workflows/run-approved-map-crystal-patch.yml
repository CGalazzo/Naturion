name: Run approved map crystal patch

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  patch-approved-branch:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'change/map-encounter-crystals'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout approved change branch
        uses: actions/checkout@v4
        with:
          ref: change/map-encounter-crystals
          fetch-depth: 0

      - name: Apply and validate approved map change
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/apply_map_crystals.py')
          content = path.read_text(encoding='utf-8')
          if content.count('""""') != 2:
              raise SystemExit('Unexpected multiline delimiter count')
          path.write_text(content.replace('""""', '"""'), encoding='utf-8')
          PY
          python .github/apply_map_crystals.py
          python - <<'PY'
          from pathlib import Path
          import re

          text = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', text, flags=re.S)
          if not scripts:
              raise SystemExit('No inline script found for syntax validation')
          Path('/tmp/naturion-inline.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/naturion-inline.js
          git diff --check

      - name: Commit only the approved game change
        shell: bash
        run: |
          rm -f \
            .github/apply_map_crystals.py \
            .github/workflows/apply-map-encounter-crystals.yml \
            README_PATCH_TRIGGER.tmp \
            README_PATCH_TRIGGER2.tmp \
            README_PATCH_TRIGGER3.tmp
          git config user.name "Naturion Update Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat: representar encontros do mapa com cristais"
          git push origin HEAD:change/map-encounter-crystals
