name: Run approved map crystal patch

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  patch-approved-branch:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'change/map-encounter-crystals'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout approved change branch
        uses: actions/checkout@v4
        with:
          ref: change/map-encounter-crystals
          fetch-depth: 0

      - name: Extract and run the reviewed patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          workflow_path = Path('.github/workflows/apply-map-encounter-crystals.yml')
          workflow = workflow_path.read_text(encoding='utf-8')
          blocks = re.findall(r"          python - <<'PY'\n(.*?)\n          PY", workflow, flags=re.S)
          if len(blocks) < 2:
              raise SystemExit(f'Expected patch and validation blocks, found {len(blocks)}')
          Path('/tmp/apply-map-crystals.py').write_text(textwrap.dedent(blocks[0]), encoding='utf-8')
          Path('/tmp/validate-map-crystals.py').write_text(textwrap.dedent(blocks[1]), encoding='utf-8')
          PY
          python /tmp/apply-map-crystals.py
          python /tmp/validate-map-crystals.py
          node --check /tmp/naturion-inline.js
          git diff --check

      - name: Commit only the approved index change
        shell: bash
        run: |
          rm .github/workflows/apply-map-encounter-crystals.yml
          git config user.name "Naturion Update Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html .github/workflows/apply-map-encounter-crystals.yml
          git commit -m "feat: representar encontros do mapa com cristais"
          git push origin HEAD:change/map-encounter-crystals
