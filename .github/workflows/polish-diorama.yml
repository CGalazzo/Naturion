name: Revisar integração do diorama 3D

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  polish-diorama:
    if: github.head_ref == 'feature/diorama-forest-desktop'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Aplicar revisão final
        run: python .github/scripts/polish_diorama.py

      - name: Validar todos os módulos
        run: |
          node --check src/diorama/engine.js
          node --check src/diorama/input-controller.js
          node --check src/diorama/player-controller.js
          node --check src/diorama/entity-system.js
          node --check src/diorama/battle-bridge.js
          node --check src/diorama/stages/bosque-clareira.js
          node --check src/diorama/main.js

      - name: Validar script principal existente
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script>(.*?)</script>', text, re.S)
          assert scripts
          Path('/tmp/naturion-main.js').write_text(scripts[-1], encoding='utf-8')
          PY
          node --check /tmp/naturion-main.js

      - name: Validar correções funcionais
        run: |
          python - <<'PY'
          from pathlib import Path
          index = Path('index.html').read_text(encoding='utf-8')
          player = Path('src/diorama/player-controller.js').read_text(encoding='utf-8')
          stage = Path('src/diorama/stages/bosque-clareira.js').read_text(encoding='utf-8')
          main = Path('src/diorama/main.js').read_text(encoding='utf-8')
          engine = Path('src/diorama/engine.js').read_text(encoding='utf-8')
          assert 'echoEntryConfirm.hidden = true;' in index
          assert 'Math.SQRT1_2' in player
          assert 'minX: 8.35, maxX: 14.65' in stage
          assert 'blockedGate: { x: 11.5' in stage
          assert 'teamPanel.hidden = true;' in main
          assert 'teamPanel.hidden || event.code !== "Escape"' in main
          assert 'three.module.min.js' in engine
          assert 'const ECHO_AREAS = [];' in index
          print('Modal antigo limpo, portão funcional e movimento relativo à câmera validados.')
          PY

      - name: Remover validadores temporários
        run: git rm .github/scripts/polish_diorama.py .github/workflows/polish-diorama.yml

      - name: Confirmar escopo final
        run: |
          python - <<'PY'
          import subprocess
          allowed = {
            'index.html',
            'styles/diorama.css',
            'src/diorama/engine.js',
            'src/diorama/input-controller.js',
            'src/diorama/player-controller.js',
            'src/diorama/entity-system.js',
            'src/diorama/battle-bridge.js',
            'src/diorama/main.js',
            'src/diorama/stages/bosque-clareira.js',
          }
          changed = set(subprocess.check_output(['git', 'diff', '--name-only', 'origin/main'], text=True).splitlines())
          assert changed == allowed, f'Diff inesperado: {sorted(changed)}'
          PY

      - name: Gravar revisão
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: revisar navegação e bloqueios do diorama"
          git push origin HEAD:${{ github.head_ref }}
