name: Limpar referências antigas do overworld

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  clean-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar branch
        uses: actions/checkout@v4
        with:
          ref: feature/overworld-bosque-luminal
          fetch-depth: 0

      - name: Corrigir identificadores e validar
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          text = text.replace('`diorama-${form.id}-${Date.now()}`', '`overworld-${form.id}-${Date.now()}`')
          text = text.replace('payload.stageId || "bosque-clareira-diorama"', 'payload.stageId || "bosque-luminal-overworld"')
          if 'diorama' in text.lower():
              raise RuntimeError('Ainda existem referências nominais ao diorama no index.html.')
          path.write_text(text, encoding='utf-8')
          PY
          node --check <(python3 - <<'PY'
          from pathlib import Path
          import re
          text = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>', text, flags=re.S | re.I)
          print('\n'.join(scripts))
          PY
          )
          find src/overworld -name '*.js' -print0 | xargs -0 -n1 node --check
          test ! -d src/diorama
          test ! -f styles/diorama.css
          git diff --check

      - name: Publicar commit limpo
        run: |
          rm -f .github/workflows/clean-overworld-residuals.yml
          rmdir .github/workflows .github 2>/dev/null || true
          git config user.name "Naturion Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "chore: remover referências finais do antigo diorama"
          git push origin feature/overworld-bosque-luminal
