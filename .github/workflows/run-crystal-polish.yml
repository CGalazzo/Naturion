name: Run approved crystal polish

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  patch-approved-branch:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'change/crystal-polish-interactions'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout approved change branch
        uses: actions/checkout@v4
        with:
          ref: change/crystal-polish-interactions
          fetch-depth: 0

      - name: Extract and apply approved patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          workflow = Path('.github/workflows/apply-crystal-polish.yml').read_text(encoding='utf-8')
          blocks = re.findall(r"          python3 - <<'PY'\n(.*?)\n          PY", workflow, flags=re.S)
          if len(blocks) != 2:
              raise SystemExit(f'Expected 2 Python blocks, found {len(blocks)}')

          def unwrap(block):
              return "\n".join(
                  line[10:] if line.startswith("          ") else line
                  for line in block.splitlines()
              ) + "\n"

          index_path = Path('index.html')
          index_text = index_path.read_text(encoding='utf-8')
          index_text, tutorial_count = re.subn(
              r'(<div class="plumirel-world encounter-crystal"[^>]*>\s*)<span class="crystal-visual" aria-hidden="true">\s*<img class="crystal-base"[^>]*>\s*<img class="crystal-gem"[^>]*>\s*</span>',
              r'\1<span class="crystal-visual" aria-hidden="true"></span>',
              index_text,
              count=1,
              flags=re.S
          )
          if tutorial_count != 1:
              raise SystemExit(f'Tutorial crystal normalization expected 1 match, found {tutorial_count}')

          npc_replacement = '''          const label = document.createElement("small");
          label.className = "echo-npc-name";
          label.textContent = area.npc.name;
          const interaction = document.createElement("small");
          interaction.className = "echo-npc-interact";
          interaction.textContent = "E · Conversar";
          interaction.hidden = true;
          npc.append(image, label, interaction);'''
          index_text, npc_count = re.subn(
              r'          const label = document\.createElement\("small"\);\s*          label\.className = "echo-npc-name";\s*          label\.textContent = area\.npc\.name;\s*          npc\.append\(image, label\);',
              npc_replacement,
              index_text,
              count=1
          )
          if npc_count != 1:
              raise SystemExit(f'NPC interaction normalization expected 1 match, found {npc_count}')
          index_path.write_text(index_text, encoding='utf-8')

          apply_script = unwrap(blocks[0])
          apply_script = apply_script.replace(
              "replace_once(old_tutorial, new_tutorial, 'remover base do cristal do tutorial')",
              "# cristal do tutorial ja normalizado pelo executor"
          )
          apply_script = apply_script.replace(
              "replace_once(old_npc, new_npc, 'adicionar aviso local do NPC')",
              "# aviso local do NPC ja normalizado pelo executor"
          )
          Path('/tmp/apply-crystal-polish.py').write_text(apply_script, encoding='utf-8')
          Path('/tmp/validate-crystal-polish.py').write_text(unwrap(blocks[1]), encoding='utf-8')
          PY
          python3 /tmp/apply-crystal-polish.py
          python3 /tmp/validate-crystal-polish.py
          node --check /tmp/naturion-inline.js
          git diff --check
          test "$(git diff --name-only | tr -d '\r')" = "index.html"

      - name: Commit only the approved game change
        shell: bash
        run: |
          rm -f README_CRYSTAL_TRIGGER.tmp
          git config user.name "Naturion Update Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: integrar cristais e interacoes ao cenario"
          git push origin HEAD:change/crystal-polish-interactions
