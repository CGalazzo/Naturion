name: Remover mapas antigos da Clareira dos Ecos

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  remove-echo-maps:
    if: github.head_ref == 'change/remove-echo-maps-clean-slate'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Remover mapas antigos
        run: python .github/scripts/remove_echo_maps.py

      - name: Validar JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script>(.*?)</script>', text, re.S)
          assert scripts, 'Script principal não encontrado'
          Path('/tmp/naturion-main.js').write_text(scripts[-1], encoding='utf-8')
          PY
          node --check /tmp/naturion-main.js

      - name: Validar escopo da remoção
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('index.html').read_text(encoding='utf-8')
          assert 'const ECHO_AREAS = [];' in text
          assert 'data-world-destination="clareira-dos-ecos"' not in text
          assert 'worldFirstDestination.addEventListener("click"' not in text
          assert 'class="world-destination world-first-destination locked"' in text
          assert 'aria-label="Clareira dos Ecos — conteúdo ainda não disponível"' in text
          print('Destino visível e inativo; cinco mapas antigos removidos das definições.')
          PY

      - name: Confirmar escopo final
        run: |
          changed="$(git status --short | awk '{print $2}' | sort)"
          expected="$(printf '%s\n' '.github/scripts/remove_echo_maps.py' '.github/workflows/remove-echo-maps.yml' 'index.html' | sort)"
          test "$changed" = "$expected"

      - name: Gravar correção na branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: remover mapas antigos da Clareira dos Ecos"
          git push origin HEAD:${{ github.head_ref }}
