name: Aplicar correção final de NPCs e cristais

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply-approved-fix:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'change/fix-npc-click-grounded-crystals'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout da alteração aprovada
        uses: actions/checkout@v4
        with:
          ref: change/fix-npc-click-grounded-crystals
          fetch-depth: 0

      - name: Aplicar, validar e publicar somente o index
        shell: bash
        run: |
          if [ ! -f .github/apply_final_npc_crystal_fix.py ]; then
            echo "Correção já aplicada."
            exit 0
          fi

          python3 .github/apply_final_npc_crystal_fix.py

          python3 - <<'PY'
          from pathlib import Path
          import re
          text = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', text, flags=re.S)
          if not scripts:
              raise SystemExit('Nenhum JavaScript inline encontrado')
          Path('/tmp/naturion-inline.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY

          node --check /tmp/naturion-inline.js
          git diff --check
          test "$(git diff --name-only | tr -d '\r')" = "index.html"

          rm -f .github/apply_final_npc_crystal_fix.py README_FINAL_NPC_CRYSTAL_FIX.tmp
          git config user.name "Naturion Update Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: usar clique nos NPCs e apoiar cristais no chão"
          git push origin HEAD:change/fix-npc-click-grounded-crystals
