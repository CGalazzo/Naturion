name: Aplicar polimento dos cristais

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - README_CRYSTAL_TRIGGER.tmp

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 0

      - name: Aplicar alteracoes confirmadas
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: esperado 1 trecho, encontrado {count}')
              text = text.replace(old, new, 1)

          def sub_once(pattern, replacement, label, flags=0):
              global text
              updated, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f'{label}: esperado 1 trecho, encontrado {count}')
              text = updated

          css = r'''

    /* Cristais de encontro: sem pedestal separado e integrados ao chão. */
    .encounter-crystal .crystal-base,
    .encounter-crystal .crystal-gem {
      display: none;
    }

    .encounter-crystal .crystal-visual::after {
      clip-path: inset(0 0 20% 0);
      transform: translateY(18%);
      transform-origin: 50% 100%;
      animation: encounter-crystal-glow 2.8s ease-in-out var(--crystal-delay) infinite;
    }

    .plumirel-world.alert .crystal-visual::after {
      animation: encounter-crystal-alert .48s steps(2, end) infinite;
    }

    .encounter-crystal.is-spent .crystal-visual {
      filter: grayscale(1) brightness(.62) drop-shadow(0 3px 2px rgba(0, 0, 0, .42));
    }

    .encounter-crystal.is-spent .crystal-visual::before {
      opacity: 0;
    }

    .encounter-crystal.is-spent .crystal-visual::after {
      opacity: .3;
      filter: grayscale(1) brightness(.48);
      animation: none;
    }

    .echo-wild::after,
    .plumirel-world::after {
      right: 27%;
      bottom: -1px;
      left: 27%;
      width: auto;
      height: 7px;
      opacity: .52;
      background: rgba(0, 0, 0, .46);
      filter: blur(2px);
    }

    .echo-npc-interact {
      position: absolute;
      z-index: 5;
      top: calc(100% + 4px);
      left: 50%;
      width: max-content;
      padding: 4px 7px;
      border: 1px solid rgba(255, 241, 163, .82);
      border-radius: 3px;
      background: rgba(7, 27, 17, .9);
      box-shadow: 0 2px 0 rgba(0, 0, 0, .5);
      color: #fff6b8;
      font-size: .48rem;
      font-weight: 900;
      letter-spacing: .04em;
      text-shadow: 1px 1px 0 #000;
      transform: translateX(-50%);
      pointer-events: none;
    }

    .echo-npc-interact[hidden] {
      display: none;
    }
'''
          replace_once('  </style>', css + '\n  </style>', 'inserir CSS')

          old_tutorial = '''          <span class="crystal-visual" aria-hidden="true">
            <img class="crystal-base" src="assets/puzzle/crystal-blue-voxel.webp" alt="">
            <img class="crystal-gem" src="assets/puzzle/crystal-blue-voxel.webp" alt="">
          </span>'''
          new_tutorial = '''          <span class="crystal-visual" aria-hidden="true"></span>'''
          replace_once(old_tutorial, new_tutorial, 'remover base do cristal do tutorial')

          choose_fn = r'''      const chooseEchoWild = (index, occupied = []) => {
        const area = getEchoArea();
        const level = echoRandom(area.levels[0], area.levels[1]);
        const chain = ECHO_WILD_CHAINS[echoRandom(0, ECHO_WILD_CHAINS.length - 1)];
        const form = getHighestForm(chain, level, area.maxStage, false);
        const size = getWildSize();
        const elevatedPlatforms = area.platforms.slice(1);
        const availablePlatforms = elevatedPlatforms.length ? elevatedPlatforms : area.platforms;
        const reserved = [area.npc, area.puzzle, area.passages?.previous, area.passages?.next].filter(Boolean);

        for (let attempt = 0; attempt < 80; attempt += 1) {
          const platform = availablePlatforms[echoRandom(0, availablePlatforms.length - 1)];
          const platformWidth = Math.max(.012, platform[1] - platform[0]);
          const inset = Math.min(.028, platformWidth * .22);
          const minRatio = platform[0] + inset;
          const maxRatio = platform[1] - inset;
          const xRatio = minRatio + Math.random() * Math.max(.001, maxRatio - minRatio);
          const x = xRatio * echoWorldWidth;
          const y = platform[2] * echoWorldHeight;
          const overlapsCrystal = occupied.some((other) => (
            Math.abs(other.x - x) < Math.max(108, (other.size + size) * .72)
            && Math.abs(other.y - y) < Math.max(88, (other.size + size) * .76)
          ));
          const overlapsReserved = reserved.some((target) => (
            Math.abs(target.x * echoWorldWidth - x) < 112
            && Math.abs(target.y * echoWorldHeight - y) < 90
          ));
          if (overlapsCrystal || overlapsReserved) continue;

          return {
            instanceId: `${area.id}-${Date.now()}-${index}-${Math.random().toString(16).slice(2)}`,
            chain,
            form,
            level,
            behavior: "idle",
            x,
            y,
            minX: x,
            maxX: x,
            direction: 1,
            speed: 0,
            size,
            spent: false,
            crystalStyle: getEncounterCrystalStyle(form.type),
            crystalDelay: -(index % 4) * .42,
            element: null
          };
        }

        return null;
      };
'''
          sub_once(
              r'^      const chooseEchoWild = \(index\) => \{.*?^      \};\n(?=\n      const renderEchoWild)',
              choose_fn.rstrip('\n'),
              'reescrever sorteio sem sobreposicao',
              re.M | re.S
          )

          render_fn = r'''      const renderEchoWild = (wild) => {
        const element = document.createElement("span");
        const visual = document.createElement("span");
        element.className = "echo-wild encounter-crystal";
        element.dataset.wildId = wild.instanceId;
        element.dataset.element = wild.form.type;
        element.setAttribute("aria-label", `Cristal ${wild.form.type} instável`);
        element.style.setProperty("--wild-size", `${wild.size}px`);
        element.style.setProperty("--encounter-color", wild.crystalStyle.color);
        element.style.setProperty("--encounter-bright", wild.crystalStyle.bright);
        element.style.setProperty("--encounter-dark", wild.crystalStyle.dark);
        element.style.setProperty("--encounter-detail", wild.crystalStyle.detail);
        element.style.setProperty("--crystal-delay", `${wild.crystalDelay}s`);
        visual.className = "crystal-visual";
        visual.setAttribute("aria-hidden", "true");
        element.append(visual);
        echoWildLayer.append(element);
        wild.element = element;
      };
'''
          sub_once(
              r'^      const renderEchoWild = \(wild\) => \{.*?^      \};\n(?=\n      const spawnEchoWilds)',
              render_fn.rstrip('\n'),
              'renderizar cristal sem pedestal',
              re.M | re.S
          )

          old_spawn = '''      const spawnEchoWilds = () => {
        echoWildLayer.replaceChildren();
        echoWilds = Array.from({ length: getEchoArea().count }, (_, index) => chooseEchoWild(index));
        echoWilds.forEach(renderEchoWild);
      };'''
          new_spawn = '''      const spawnEchoWilds = () => {
        echoWildLayer.replaceChildren();
        echoWilds = [];
        for (let index = 0; index < getEchoArea().count; index += 1) {
          const wild = chooseEchoWild(index, echoWilds);
          if (wild) echoWilds.push(wild);
        }
        echoWilds.forEach(renderEchoWild);
      };'''
          replace_once(old_spawn, new_spawn, 'atualizar geracao de cristais')

          old_npc = '''          const label = document.createElement("small");
          label.className = "echo-npc-name";
          label.textContent = area.npc.name;
          npc.append(image, label);
          echoNpcLayer.append(npc);'''
          new_npc = '''          const label = document.createElement("small");
          label.className = "echo-npc-name";
          label.textContent = area.npc.name;
          const interaction = document.createElement("small");
          interaction.className = "echo-npc-interact";
          interaction.textContent = "E · Conversar";
          interaction.hidden = true;
          npc.append(image, label, interaction);
          echoNpcLayer.append(npc);'''
          replace_once(old_npc, new_npc, 'adicionar aviso local do NPC')

          replace_once(
              '          if (!wild.element) return;',
              '          if (!wild.element || wild.spent) return;',
              'bloquear cristal gasto durante exploracao'
          )

          interaction_fn = r'''      const updateEchoInteraction = () => {
        const area = getEchoArea();
        echoNearInteraction = null;
        const near = (target, horizontal = 92, vertical = 74) => (
          target
          && Math.abs(echoPlayerX - target.x * echoWorldWidth) < horizontal
          && Math.abs(echoPlayerY - target.y * echoWorldHeight) < vertical
        );
        if (near(area.npc)) {
          echoNearInteraction = { type: "npc", value: area.npc };
        } else if (near(area.puzzle, 112, 86) && !isEchoPuzzleSolved()) {
          echoNearInteraction = { type: "puzzle", value: area.puzzle };
        } else if (near(area.passages?.previous, 108, 92)) {
          echoNearInteraction = {
            type: "passage",
            direction: "previous",
            value: area.passages.previous
          };
        } else if (near(area.passages?.next, 108, 92)) {
          echoNearInteraction = {
            type: "passage",
            direction: "next",
            value: area.passages.next
          };
        }

        const npcInteraction = echoNpcLayer.querySelector(".echo-npc-interact");
        if (npcInteraction) npcInteraction.hidden = echoNearInteraction?.type !== "npc";

        const showGlobalInteraction = Boolean(echoNearInteraction && echoNearInteraction.type !== "npc");
        echoInteract.hidden = !showGlobalInteraction;
        if (showGlobalInteraction) {
          const isPassage = echoNearInteraction.type === "passage";
          echoInteractKey.textContent = isPassage ? "W" : "E";
          if (echoNearInteraction.type === "puzzle") {
            echoInteractText.textContent = `Examinar desafio: ${echoNearInteraction.value.title}`;
          } else {
            echoInteractText.textContent = echoNearInteraction.direction === "previous"
              ? "Retornar ao ambiente anterior"
              : "Entrar no próximo ambiente";
          }
        }
      };
'''
          sub_once(
              r'^      const updateEchoInteraction = \(\) => \{.*?^      \};\n(?=\n      const closeEchoPassageConfirmation)',
              interaction_fn.rstrip('\n'),
              'mostrar conversa apenas sob NPC proximo',
              re.M | re.S
          )

          replace_once(
              '        if (!echoActive || !echoBattle.hidden) return;',
              '        if (!echoActive || !echoBattle.hidden || wild.spent) return;',
              'impedir nova batalha no cristal apagado'
          )

          old_remove = '''      const removeEchoEncounter = () => {
        if (!echoEncounter) return;
        echoEncounter.element?.remove();
        echoWilds = echoWilds.filter((wild) => wild !== echoEncounter);
      };'''
          new_remove = '''      const removeEchoEncounter = () => {
        if (!echoEncounter) return;
        echoEncounter.spent = true;
        echoEncounter.element?.classList.add("is-spent");
        echoEncounter.element?.setAttribute(
          "aria-label",
          `Cristal ${echoEncounter.form.type} estabilizado`
        );
      };'''
          replace_once(old_remove, new_remove, 'manter cristal apagado apos batalha')

          replace_once(
              '        echoBattleMessage.textContent = `${echoEncounter.form.name} voltou em segurança para a clareira.`;',
              '        echoBattleMessage.textContent = `A essência de ${echoEncounter.form.name} retornou ao cristal, agora estabilizado.`;',
              'ajustar mensagem ao nao absorver'
          )
          replace_once(
              '            echoAbsorbMessage.textContent = `Absorção não concluída! ${wild.form.name} permaneceu livre.`;\n            showToast(`Absorção não concluída: ${wild.form.name} retornou à clareira.`);',
              '            echoAbsorbMessage.textContent = `Absorção não concluída! A essência de ${wild.form.name} retornou ao cristal estabilizado.`;\n            showToast(`Absorção não concluída: o cristal de ${wild.form.name} ficou estabilizado.`);',
              'ajustar mensagem de falha na absorcao'
          )

          required = [
              'const chooseEchoWild = (index, occupied = []) =>',
              'classList.add("is-spent")',
              'echoNearInteraction?.type !== "npc"',
              '.encounter-crystal.is-spent',
              'interaction.textContent = "E · Conversar"'
          ]
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit(f'Marcadores ausentes: {missing}')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Validar JavaScript e escopo
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, re.S)
          Path('/tmp/naturion-inline.js').write_text('\n'.join(scripts), encoding='utf-8')
          assert 'echoEncounter.element?.remove()' not in html
          assert 'echoWilds = echoWilds.filter((wild) => wild !== echoEncounter)' not in html
          assert 'const base = document.createElement("img")' not in html
          assert 'echo-npc-interact' in html
          PY
          node --check /tmp/naturion-inline.js
          git diff --check
          test "$(git diff --name-only | tr -d '\r')" = "index.html"

      - name: Publicar alteracao na branch temporaria
        shell: bash
        run: |
          rm -f README_CRYSTAL_TRIGGER.tmp
          git config user.name "Naturion Update Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: integrar cristais e interacoes ao cenario"
          git push origin HEAD:${GITHUB_HEAD_REF}
