name: Aplicar âncora visual dos pés

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply-approved-fix:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'change/align-character-feet-all-maps'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout da alteração aprovada
        uses: actions/checkout@v4
        with:
          ref: change/align-character-feet-all-maps
          fetch-depth: 0

      - name: Aplicar e validar somente a âncora dos pés
        shell: bash
        run: |
          python3 .github/apply-character-foot-anchor.py

          python3 - <<'PY'
          from pathlib import Path
          import re

          text = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', text, flags=re.S)
          if not scripts:
              raise SystemExit('Nenhum JavaScript inline encontrado')
          Path('/tmp/naturion-inline.js').write_text('\n'.join(scripts), encoding='utf-8')

          checks = {
              'tutorial': '--explorer-hero-foot-offset',
              'clareira': '--echo-player-foot-offset',
              'medição': 'const alignExplorationCharacterFeet',
              'sobreposição mínima': 'const groundOverlap = 1;'
          }
          for label, marker in checks.items():
              if marker not in text:
                  raise SystemExit(f'Validação ausente ({label}): {marker}')
          PY

          node --check /tmp/naturion-inline.js
          git diff --check
          test "$(git diff --name-only | tr -d '\r')" = "index.html"

      - name: Publicar somente index.html na branch
        shell: bash
        run: |
          rm -f \
            .github/apply-character-foot-anchor.py \
            .github/workflows/apply-character-foot-anchor.yml
          git config user.name "Naturion Update Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: encostar os pés do personagem no chão em todos os mapas"
          git push origin HEAD:change/align-character-feet-all-maps
